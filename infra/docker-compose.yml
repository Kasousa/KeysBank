services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: keysbank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bank}
      POSTGRES_USER: ${POSTGRES_USER:-bankuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bankpass123}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./local/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bankuser} -d ${POSTGRES_DB:-bank}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - keysbank-network

  # Backend API (Spring Boot)
  backend:
    build:
      context: ../back-end
      dockerfile: Dockerfile
    container_name: keysbank-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bank}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bankuser}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-bankpass123}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: ${SHOW_SQL:-false}
      SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - keysbank-network

  # Frontend (React + Vite + Nginx)
  frontend:
    build:
      context: ../front-end
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: keysbank-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - keysbank-network

  # Adminer - Database Management UI (opcional)
  adminer:
    image: adminer:latest
    container_name: keysbank-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - keysbank-network
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local

networks:
  keysbank-network:
    driver: bridge